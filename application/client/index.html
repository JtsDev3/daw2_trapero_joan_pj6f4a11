<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home – Order Management App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/common.js" defer></script>
</head>
<body>
    <main class="page">
        <section class="card card--medium home">
            <svg class="logo" viewBox="0 0 64 64" role="img" aria-labelledby="logoTitle">
                <title id="logoTitle">Order Management App logo</title>
                <circle class="logo-background" cx="32" cy="32" r="32"/>
                <path class="logo-handle" d="M23 27 L29 15 M41 27 L35 15"/>
                <circle class="logo-dot" cx="39" cy="24" r="6"/>
                <path class="logo-basket" d="M11 27 H53 L47.5 50 Q47 52 45 52 H19 Q17 52 16.5 50 Z"/>
                <path class="logo-slats" d="M24 33 V46 M32 33 V46 M40 33 V46"/>
            </svg>
            <h1>Order Management App</h1>
            <p class="lead">Customer orders for our European supermarket chain, managed by the sales team.</p>
            <div class="button-bar button-bar--center">
                <button type="button" data-href="documentation.html">Documentation</button>
                <button type="button" class="primary" data-href="login.html">Login</button>
            </div>
        </section>
    </main>

</html>
