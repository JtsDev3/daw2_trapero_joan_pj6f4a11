<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View orders – Order Management App</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/common.js" defer></script>
    <script src="js/menu.js" defer></script>
</head>
<body>
    <header class="app-header">
        <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
            <circle class="logo-background" cx="32" cy="32" r="32"/>
            <path class="logo-handle" d="M19 28 Q32 3 45 28"/>
            <circle class="logo-dot" cx="31" cy="23" r="7"/>
            <path class="logo-basket" d="M11 27 H53 L47.5 50 Q47 52 45 52 H19 Q17 52 16.5 50 Z"/>
            <path class="logo-slats" d="M24 33 V46 M32 33 V46 M40 33 V46"/>
        </svg>
        <span class="app-name">Order Management App</span>
    </header>

    <main class="page">
        <section class="card card--narrow">
            <h1>View orders</h1>
            <p class="hint">Choose whether you want to see all the orders or a single order, and click Go.</p>

            <form id="menuForm" novalidate>
                <div class="form-field">
                    <label for="operation">Option</label>
                    <select id="operation" name="operation">
                        <option value="">-- Select an option --</option>
                        <option value="../server/allOrders.php">All orders</option>
                        <option value="singleOrder.html">Single order</option>
                    </select>
                </div>

                <p id="menuMessage" class="message" role="alert" hidden></p>

                <div class="button-bar">
                    <button type="submit" class="primary">Go</button>
                    <button type="button" data-href="operations.html">Operations menu</button>
                    <button type="button" data-href="index.html">Home</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
